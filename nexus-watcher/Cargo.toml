[package]
name = "nexus-watcher"
version = "0.4.1"
edition = "2021"
description = "Nexus Watcher constructs a social graph out of all of the events on pubky-core homeservers"
homepage = "https://github.com/pubky/pubky-nexus"
repository = "https://github.com/pubky/pubky-nexus"
license = "MIT"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
deadpool-redis = { workspace = true }
futures = { workspace = true }
neo4rs = { workspace = true }
opentelemetry = { workspace = true }
pubky = { workspace = true }
pubky-app-specs = { workspace = true }
pubky-social-specs = { workspace = true }
reqwest = { version = "0.13", default-features = false }
nexus-common = { version = "0.4.1", path = "../nexus-common" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
base32 = "0.5"
ed25519-dalek = "2"
httpc-test = "0.1.10"
opentelemetry_sdk = { workspace = true, features = ["testing"] }
pubky-testnet = { workspace = true }
# The migrator is only a test oracle: the agreement test in `events::flip` compares the ids the
# flip leaves with the ones the migrator writes from the same `pubky.app` bytes.
pubky-social-specs = { workspace = true, features = ["migrator"] }
rand = "0.10.0"
tokio = { workspace = true, features = ["test-util"] }
tokio-shared-rt = { workspace = true }
tracing-test = { workspace = true }
