name: Production image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or 40-character SHA to build (must be an ancestor of origin/main)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-image-${{ github.event.inputs.ref || github.sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: marketplace-nexus

jobs:
  publish:
    name: Publish production image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      # GHCR names must be lowercase, and the owner follows the repository
      # through a transfer.
      - name: Resolve image name from repository owner
        run: |
          set -eu
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/$owner/$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Check out requested ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Publish linux/amd64 image
        run: |
          set -eu
          SOURCE_SHA="$(git rev-parse HEAD)"
          case "$SOURCE_SHA" in
            *[!0-9a-fA-F]*|'') echo "SOURCE_SHA must be hex" >&2; exit 1 ;;
          esac
          test "${#SOURCE_SHA}" -eq 40
          git fetch -q origin main
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          test -f Dockerfile.railway
          metadata_file="$RUNNER_TEMP/production-image-push-metadata.json"
          mkdir -p "$(dirname "$metadata_file")" "$RUNNER_TEMP/production-image"
          docker buildx build \
            --file Dockerfile.railway \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE:$SOURCE_SHA" \
            --provenance=true \
            --sbom=true \
            --push \
            --metadata-file "$metadata_file" \
            .
          digest="$(jq -r '."containerimage.digest" // empty' "$metadata_file")"
          case "$digest" in sha256:*) ;; *) echo "missing image digest" >&2; exit 1 ;; esac
          docker pull --platform linux/amd64 "$IMAGE@$digest"
          revision="$(docker image inspect "$IMAGE@$digest" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          arch="$(docker image inspect "$IMAGE@$digest" --format '{{.Architecture}}')"
          test "$revision" = "$SOURCE_SHA"
          test "$arch" = amd64
          {
            echo "### Published production image"
            echo "- source SHA: \`$SOURCE_SHA\`"
            echo "- platform: linux/amd64"
            echo "- tag: \`$IMAGE:$SOURCE_SHA\`"
            echo "- digest: \`$digest\`"
            echo "- immutable image: \`$IMAGE@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          jq -n \
            --arg immutable_image "$IMAGE@$digest" \
            --arg digest "$digest" \
            --arg source_sha "$SOURCE_SHA" \
            --arg architecture "$arch" \
            --slurpfile buildx_push_metadata "$metadata_file" \
            '{
              immutable_image: $immutable_image,
              digest: $digest,
              source_sha: $source_sha,
              architecture: $architecture,
              buildx_push_metadata: $buildx_push_metadata[0]
            }' > "$RUNNER_TEMP/production-image/publish-evidence.json"

      - name: Upload publish evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: marketplace-nexus-production-image-publish-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/production-image/publish-evidence.json
          retention-days: 14
