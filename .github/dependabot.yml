version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      day: "sunday"
    commit-message:
      prefix: "deps"
    rebase-strategy: "auto"
    # Crates released together are bumped together, at any version level, so
    # one PR compiles. A dependency that matches several groups joins the
    # first one listed, so these come before cargo-patch. Any other crate gets
    # a PR per non-patch release (for a 0.x crate a minor is breaking, e.g.
    # pubky 0.7 -> 0.9), so one migration can't hold back every other update.
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry*"
      pubky:
        patterns:
          - "pubky*"
      utoipa:
        patterns:
          - "utoipa*"
      redis:
        patterns:
          - "redis"
          - "deadpool-redis"
      cargo-patch:
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      day: "sunday"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      day: "sunday"
    commit-message:
      prefix: "build"
