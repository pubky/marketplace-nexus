version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      day: "sunday"
    commit-message:
      prefix: "deps"
    rebase-strategy: "auto"
    # Only patch releases are grouped. Any other release (for a 0.x crate a
    # minor is breaking, e.g. pubky 0.7 -> 0.9) gets its own PR, so one
    # migration can't hold back every other update.
    groups:
      cargo-patch:
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      day: "sunday"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      day: "sunday"
    commit-message:
      prefix: "build"
