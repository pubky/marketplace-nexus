# Service name used for tracing, logging, and metrics in OpenTelemetry
name = "nexusd.migration"
# List multi-staged migrations whose dual_write phase is done and that are ready
# for backfilling. A listed migration is moved from dual_write to backfill once;
# one at any other phase is left alone, and a single-staged migration (it starts
# at backfill) is not affected. Example
#backfill_ready = ["Xakala1741101644"]
backfill_ready = []

# Backfills that re-read canonical records from homeservers (e.g. the
# auction-terms reindex) use the Pubky client. Set testnet = true and the
# host when the homeservers live on a local testnet; mainnet by default.
testnet = false
testnet_host = "localhost"

[stack]
# Logging, options: error, warn, info, debug and trace
log_level = "debug"
files_path = "./static/files"
# OTLP_ENDPOINT is set to empty by default. If you want to enable tracing, set it to the OpenTelemetry Collector endpoint
#otlp_endpoint=""

[stack.db]
redis = "redis://localhost:6379"

[stack.db.neo4j]
uri = "bolt://localhost:7687"
# Not needed in the Community Edition
#user = "neo4j"
password = "12345678"
# Slow-query warnings disabled for CLI migration commands (uncomment to enable).
#slow_query_logging_threshold_ms = 100
# Include the Cypher query text in slow query log entries
#slow_query_logging_include_cypher = false
